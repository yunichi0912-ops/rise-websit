<section class="cta" aria-labelledby="cta-title">
  <div class="cta__bg" aria-hidden="true"></div>
  <div class="container cta__inner">
    <div class="cta__head" data-reveal>
      <p class="section-label section-label--light"><span>CONTACT</span></p>
      <h2 class="cta__title" id="cta-title">工事のご相談・お見積りは<br>お気軽にどうぞ。</h2>
      <p class="cta__lead">元請け様・協力会社様からのご依頼、個人のお客様からのご相談まで承ります。</p>
    </div>
    <div class="cta__actions" data-reveal data-reveal-delay="1">
      <a class="cta-card" href="#" data-demo-action="tel" role="button">
        <span class="cta-card__label">お電話でのお問い合わせ</span>
        <span class="cta-card__main">{{company.tel}}</span>
        <span class="cta-card__sub">TEL/FAX｜受付時間はサンプル表示：平日 8:00〜18:00</span>
      </a>
      <a class="cta-card cta-card--form" href="contact.html">
        <span class="cta-card__label">フォームでのお問い合わせ</span>
        <span class="cta-card__main cta-card__main--text">お問い合わせフォーム<span class="arrow" aria-hidden="true"></span></span>
        <span class="cta-card__sub">24時間受付（デモのため送信はされません）</span>
      </a>
    </div>
  </div>
</section>
